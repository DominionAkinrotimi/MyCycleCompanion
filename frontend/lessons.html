<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>💗 MyCycleCompanion – Lessons</title>
    <meta name="description" content="Short, plain-language lessons on the menstrual cycle: late periods, cramps, the emergency pill, discharge, ovulation, PMS and when to see a doctor." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { "primary": "#ee2b8c", "background-light": "#f8f6f7", "background-dark": "#221019" },
            fontFamily: { "display": ["Manrope", "sans-serif"] },
          },
        },
      }
    </script>
  </head>

  <body class="bg-background-light dark:bg-background-dark font-display text-[#181114] dark:text-gray-200 min-h-screen">
    <header class="flex items-center justify-between px-6 py-3 border-b border-primary/20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm sticky top-0 z-10">
      <a href="/" class="text-lg font-bold">💗 MyCycleCompanion</a>
      <nav class="flex items-center gap-4">
        <a href="/chat" class="rounded-full bg-primary text-white text-sm font-bold px-4 py-2 hover:bg-opacity-90">Chat</a>
      </nav>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-10">
      <h1 class="text-3xl font-extrabold mb-2">Cycle lessons</h1>
      <p class="text-gray-600 dark:text-gray-400 mb-6">Short, plain-language guides to what's happening in your body. Supportive information, not medical advice.</p>

      <div id="filters" class="flex flex-wrap gap-2 mb-8"></div>
      <div id="lessons" class="space-y-4"></div>

      <p class="text-xs text-gray-500 mt-10">Based on public health guidance such as the NHS, ACOG and WHO. If something worries you, please see a health professional.</p>
    </main>

    <script>
      const list = document.getElementById("lessons");
      const filters = document.getElementById("filters");

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }

      function bullets(title, items, tone) {
        const box = el("div", "mt-4");
        box.appendChild(el("p", "font-bold text-sm " + tone, title));
        const ul = el("ul", "list-disc pl-5 text-sm space-y-1 mt-1");
        items.forEach((t) => ul.appendChild(el("li", "", t)));
        box.appendChild(ul);
        return box;
      }

      function render(lessons, category) {
        list.innerHTML = "";
        lessons.filter((l) => !category || l.category === category).forEach((l) => {
          const card = el("details", "group rounded-2xl bg-white dark:bg-[#2b1d25] shadow-sm border border-primary/10 p-5");
          card.id = l.id;
          const sum = el("summary", "cursor-pointer list-none flex items-start justify-between gap-4");
          const head = el("div");
          head.appendChild(el("p", "text-xs font-bold uppercase tracking-wide text-primary", l.category));
          head.appendChild(el("h2", "text-lg font-bold mt-1", l.title));
          sum.appendChild(head);
          sum.appendChild(el("span", "text-primary text-xl group-open:rotate-45 transition-transform", "+"));
          card.appendChild(sum);
          card.appendChild(el("p", "mt-3 text-sm leading-relaxed", l.summary));
          const urgent = l.id === "urgent";
          card.appendChild(bullets(urgent ? "Get help straight away if you have:" : "Tips", l.tips, "text-[#181114] dark:text-white"));
          card.appendChild(bullets(urgent ? "What to do" : "See a doctor if", l.see_doctor, "text-primary"));
          const ask = el("a", "inline-block mt-4 text-sm font-bold text-primary hover:underline", "Ask about this in the chat →");
          ask.href = "/chat";
          card.appendChild(ask);
          list.appendChild(card);
        });
        const target = location.hash && document.getElementById(location.hash.slice(1));
        if (target) { target.open = true; target.scrollIntoView(); }
      }

      fetch("/data/lessons.json")
        .then((r) => r.json())
        .then(({ lessons }) => {
          const cats = [...new Set(lessons.map((l) => l.category))];
          let active = null;
          ["All", ...cats].forEach((c) => {
            const b = el("button", "rounded-full border border-primary/40 px-3 py-1 text-xs font-bold text-primary hover:bg-primary/10", c);
            b.type = "button";
            b.addEventListener("click", () => { active = c === "All" ? null : c; render(lessons, active); });
            filters.appendChild(b);
          });
          render(lessons, null);
        })
        .catch(() => { list.textContent = "Lessons couldn't load. Please refresh the page."; });
    </script>
  </body>
</html>
